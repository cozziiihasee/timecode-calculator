<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">

<title>タイムコード計算機</title>

<meta name="theme-color" content="#0f172a">

<style>

:root{
    --bg:#0f172a;
    --card:#1e293b;
    --card2:#111827;
    --text:#f8fafc;
    --sub:#94a3b8;
    --green:#22c55e;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    padding:15px;
    padding-bottom:30px;
}

h1{
    font-size:24px;
    margin-bottom:5px;
}

.subtitle{
    color:var(--sub);
    margin-bottom:15px;
}

.result-box{
    position:sticky;
    top:10px;
    z-index:100;

    background:var(--card2);

    border-radius:16px;
    padding:18px;

    margin-bottom:15px;

    box-shadow:0 5px 20px rgba(0,0,0,.35);
}

.result-label{
    color:var(--sub);
    text-align:center;
}

.result{
    text-align:center;
    color:var(--green);
    font-weight:700;

    font-size:clamp(36px,10vw,56px);

    margin-top:10px;
    word-break:break-all;
}

.copy-message{
    text-align:center;
    color:var(--sub);
    font-size:12px;
    margin-top:8px;
}

textarea{

    width:100%;

    min-height:320px;

    background:var(--card);

    border:none;
    border-radius:16px;

    color:white;

    font-size:22px;
    line-height:1.8;

    padding:18px;

    resize:vertical;
}

textarea:focus{
    outline:none;
}

.info{
    margin-top:15px;

    background:var(--card);

    border-radius:16px;

    padding:15px;

    color:var(--sub);

    line-height:1.8;
}

.footer{
    margin-top:15px;
}

.clear{
    width:100%;
    height:55px;

    background:#dc2626;

    color:white;

    border:none;
    border-radius:12px;

    font-size:18px;
}

</style>
</head>

<body>

<h1>⏱ タイムコード計算機</h1>

<div class="subtitle">
スマホ対応版
</div>

<div
class="result-box"
onclick="copyResult()">

    <div class="result-label">
        計算結果（タップでコピー）
    </div>

    <div id="result" class="result">
        00:00:00:00
    </div>

    <div id="msg" class="copy-message">
        タップでコピー
    </div>

</div>

<textarea
id="input"
oninput="calculate()"
placeholder="入力例

15

00:15

10:00

00:15+00:30

10:00:00:00+00:00:15:00

00:30:00:00-00:00:15:00"></textarea>

<div class="info">

15 → 15秒<br>
00:15 → 15秒<br>
10:00 → 10分00秒<br>
01:00:00 → 1時間<br>
00:00:15:00 → 15秒00f<br>
10:00:00:00 → 10時間00分00秒00f<br><br>

改行＝加算<br>
スペース不要

</div>

<div class="footer">

<button
class="clear"
onclick="clearInput()">
🗑 クリア
</button>

</div>

<script>

const FPS = 30;

function calculate(){

    const lines =
        document
        .getElementById("input")
        .value
        .split("\n");

    let totalFrames = 0;

    lines.forEach(line=>{

        line = line.trim();

        if(line){

            totalFrames +=
                calculateExpression(line);
        }
    });

    document.getElementById("result").innerText =
        framesToTC(totalFrames);
}

function calculateExpression(expression){

    const tokens =
        expression.match(
            /\d+:\d+:\d+:\d+|\d+:\d+:\d+|\d+:\d+|[+\-]|\d+/g
        );

    if(!tokens) return 0;

    let total = 0;
    let op = "+";

    for(const token of tokens){

        if(token==="+" || token==="-"){

            op = token;
            continue;
        }

        const value =
            parseTime(token);

        if(op==="+"){
            total += value;
        }else{
            total -= value;
        }
    }

    return total;
}

function parseTime(str){

    let h=0;
    let m=0;
    let s=0;
    let f=0;

    const p = str.split(":");

    if(p.length===4){

        h=parseInt(p[0]);
        m=parseInt(p[1]);
        s=parseInt(p[2]);
        f=parseInt(p[3]);

    }else if(p.length===3){

        h=parseInt(p[0]);
        m=parseInt(p[1]);
        s=parseInt(p[2]);

    }else if(p.length===2){

        m=parseInt(p[0]);
        s=parseInt(p[1]);

    }else{

        return parseLegacy(str);
    }

    return (
        h*3600*FPS +
        m*60*FPS +
        s*FPS +
        f
    );
}

function parseLegacy(str){

    let h=0,m=0,s=0;

    switch(str.length){

        case 1:
        case 2:
            s=parseInt(str)||0;
            break;

        case 3:
            m=parseInt(str.substring(0,1))||0;
            s=parseInt(str.substring(1,3))||0;
            break;

        case 4:
            m=parseInt(str.substring(0,2))||0;
            s=parseInt(str.substring(2,4))||0;
            break;

        case 5:
            h=parseInt(str.substring(0,1))||0;
            m=parseInt(str.substring(1,3))||0;
            s=parseInt(str.substring(3,5))||0;
            break;

        case 6:
            h=parseInt(str.substring(0,2))||0;
            m=parseInt(str.substring(2,4))||0;
            s=parseInt(str.substring(4,6))||0;
            break;
    }

    return (
        h*3600*FPS +
        m*60*FPS +
        s*FPS
    );
}

function framesToTC(frames){

    let sign="";

    if(frames<0){

        sign="-";
        frames=Math.abs(frames);
    }

    const h =
        Math.floor(frames/(3600*FPS));

    frames%=3600*FPS;

    const m =
        Math.floor(frames/(60*FPS));

    frames%=60*FPS;

    const s =
        Math.floor(frames/FPS);

    const f =
        frames%FPS;

    return (
        sign +
        String(h).padStart(2,"0")+":"+
        String(m).padStart(2,"0")+":"+
        String(s).padStart(2,"0")+":"+
        String(f).padStart(2,"0")
    );
}

function clearInput(){

    document.getElementById("input").value="";
    calculate();
}

async function copyResult(){

    const text =
        document.getElementById("result").innerText;

    try{

        await navigator.clipboard.writeText(text);

        document.getElementById("msg").innerText =
            "コピーしました";

        setTimeout(()=>{

            document.getElementById("msg").innerText =
                "タップでコピー";

        },1500);

    }catch(e){}
}

calculate();

</script>

</body>
</html>
