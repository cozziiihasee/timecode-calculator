<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Nextry TC Calculator</title>

<style>

:root{
  --bg:#232323;
  --panel:#2f2f2f;
  --result:#00ff66;
  --accent:#ff9900;
  --text:#ffffff;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  padding:12px;
}

h1{
  font-size:22px;
  margin-bottom:12px;
}

.resultBox{
  position:sticky;
  top:8px;
  z-index:100;

  background:#111;

  border-radius:16px;

  padding:18px;

  margin-bottom:12px;

  text-align:center;

  cursor:pointer;
}

.result{
  color:var(--result);

  font-size:clamp(34px,9vw,56px);

  font-family:Consolas,monospace;

  font-weight:700;
}

.frames{
  margin-top:8px;
  color:#999;
}

.copyInfo{
  color:var(--accent);
  font-size:12px;
  margin-top:8px;
}

.keypad{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  margin-bottom:12px;
}

.keypad button{

  height:56px;

  border:none;
  border-radius:12px;

  background:#444;

  color:white;

  font-size:20px;
  font-weight:700;
}

.keypad button:active{
  transform:scale(.96);
}

textarea{

  width:100%;
  min-height:280px;

  background:var(--panel);

  color:white;

  border:none;
  border-radius:16px;

  padding:14px;

  font-size:24px;

  line-height:1.6;

  resize:none;
}

textarea:focus{
  outline:2px solid var(--accent);
}

.actionButtons{

  display:grid;

  grid-template-columns:1fr 1fr;

  gap:8px;

  margin-top:12px;
}

.actionButtons button{

  height:56px;

  border:none;

  border-radius:12px;

  color:white;

  font-size:18px;

  font-weight:700;
}

.newLineBtn{
  background:#1976d2;
}

.clearBtn{
  background:#d32f2f;
}

</style>
</head>
<body>

<h1>⏱ Nextry TC Calculator</h1>

<div
class="resultBox"
onclick="copyResult()">

  <div
  id="result"
  class="result">
    00:00:00:00
  </div>

  <div
  id="frames"
  class="frames">
    0 frames
  </div>

  <div
  id="copyInfo"
  class="copyInfo">
    タップでコピー
  </div>

</div>

<div class="keypad">

  <button onclick="insertText('+')">＋</button>
  <button onclick="insertText('-')">－</button>
  <button onclick="insertText('*')">×</button>
  <button onclick="insertText('/')">÷</button>

  <button onclick="insertText('\n')">↵</button>
  <button onclick="backspace()">⌫</button>

</div>

<textarea
id="input"
inputmode="numeric"
autocomplete="off"
autocorrect="off"
autocapitalize="off"
spellcheck="false"
oninput="calculate()"
placeholder="15+30

2930-15-30

15*12

10000000+1500

10001500-10000000"></textarea>

<div class="actionButtons">

<button
class="newLineBtn"
onclick="insertText('\n')">
↵ 改行
</button>

<button
class="clearBtn"
onclick="clearInput()">
🗑 クリア
</button>

</div>

<script>

const FPS = 30;

function parseInput(value){

  value = value.trim();

  if(value.length <= 2){

    return Number(value) * FPS;
  }

  if(value.length <= 4){

    const mm =
      parseInt(value.slice(0,-2)) || 0;

    const ss =
      parseInt(value.slice(-2)) || 0;

    return (
      mm * 60 +
      ss
    ) * FPS;
  }

  if(value.length <= 6){

    const hh =
      parseInt(value.slice(0,-4)) || 0;

    const mm =
      parseInt(value.slice(-4,-2)) || 0;

    const ss =
      parseInt(value.slice(-2)) || 0;

    return (
      hh * 3600 +
      mm * 60 +
      ss
    ) * FPS;
  }

  value =
    value.padStart(8,"0");

  const hh =
    parseInt(value.slice(0,2));

  const mm =
    parseInt(value.slice(2,4));

  const ss =
    parseInt(value.slice(4,6));

  const ff =
    parseInt(value.slice(6,8));

  return (
    hh * 3600 * FPS +
    mm * 60 * FPS +
    ss * FPS +
    ff
  );
}

function evaluateLine(line){

  const tokens =
    line.match(/\d+|[+\-*/]/g);

  if(!tokens){
    return 0;
  }

  let result = null;
  let operator = "+";

  for(const token of tokens){

    if(["+","-","*","/"].includes(token)){

      operator = token;
      continue;
    }

    let value;

    if(
      /^\d+$/.test(token) &&
      result !== null &&
      (operator === "*" || operator === "/")
    ){

      value = Number(token);

    }else{

      value = parseInput(token);
    }

    if(result === null){

      result = value;
      continue;
    }

    switch(operator){

      case "+":
        result += value;
        break;

      case "-":
        result -= value;
        break;

      case "*":
        result *= value;
        break;

      case "/":
        result /= value;
        break;
    }
  }

  return Math.round(result || 0);
}

function calculate(){

  const lines =
    document
    .getElementById("input")
    .value
    .split("\n");

  let total = 0;

  lines.forEach(line=>{

    line = line.trim();

    if(line){

      total +=
        evaluateLine(line);
    }

  });

  document
    .getElementById("result")
    .innerText =
    framesToTC(total);

  document
    .getElementById("frames")
    .innerText =
    total.toLocaleString() + " frames";
}

function framesToTC(frames){

  let sign = "";

  if(frames < 0){

    sign = "-";

    frames =
      Math.abs(frames);
  }

  const hh =
    Math.floor(
      frames /
      (3600 * FPS)
    );

  frames %=
    (3600 * FPS);

  const mm =
    Math.floor(
      frames /
      (60 * FPS)
    );

  frames %=
    (60 * FPS);

  const ss =
    Math.floor(
      frames / FPS
    );

  const ff =
    frames % FPS;

  return (
    sign +
    String(hh).padStart(2,"0")
    + ":" +
    String(mm).padStart(2,"0")
    + ":" +
    String(ss).padStart(2,"0")
    + ":" +
    String(ff).padStart(2,"0")
  );
}

function insertText(text){

  const area =
    document.getElementById("input");

  const start =
    area.selectionStart;

  const end =
    area.selectionEnd;

  area.setRangeText(
    text,
    start,
    end,
    "end"
  );

  area.focus();

  calculate();
}

function backspace(){

  const area =
    document.getElementById("input");

  const start =
    area.selectionStart;

  const end =
    area.selectionEnd;

  if(start === end && start > 0){

    area.setRangeText(
      "",
      start - 1,
      start,
      "end"
    );

  }else{

    area.setRangeText(
      "",
      start,
      end,
      "end"
    );
  }

  area.focus();

  calculate();
}

function clearInput(){

  document
    .getElementById("input")
    .value = "";

  calculate();
}

async function copyResult(){

  try{

    await navigator
      .clipboard
      .writeText(
        document
        .getElementById("result")
        .innerText
      );

    const obj =
      document.getElementById("copyInfo");

    obj.innerText =
      "コピーしました";

    setTimeout(()=>{

      obj.innerText =
        "タップでコピー";

    },1500);

  }catch(e){}
}

calculate();

</script>

</body>
</html>
