<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Nextry TC Calculator</title>

<style>

:root{
  --bg:#1d1d1d;
  --panel:#2c2c2c;
  --result:#5cff6b;
  --accent:#ff9800;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;
}

html,body{
  height:100%;
}

body{
  background:var(--bg);
  color:white;
  padding:8px;
  padding-bottom:360px;
}

.resultBox{

  position:sticky;
  top:0;

  z-index:100;

  background:#000;

  border-radius:16px;

  padding:12px;

  text-align:center;

  margin-bottom:8px;
}

.result{

  font-size:min(9vw,42px);

  font-family:Consolas,monospace;

  color:var(--result);

  font-weight:700;
}

.frames{

  margin-top:4px;

  color:#aaa;

  font-size:12px;
}

.copy{

  margin-top:2px;

  color:var(--accent);

  font-size:11px;
}

.log{

  background:var(--panel);

  border-radius:12px;

  padding:10px;

  height:260px;

  overflow-y:auto;

  font-size:18px;

  line-height:1.4;
}

.line{

  border-bottom:1px solid #444;

  padding:4px 0;

  word-break:break-all;
}

.current{

  color:var(--result);

  font-weight:700;
}

.keypad{

  position:fixed;

  left:8px;
  right:8px;

  bottom:max(8px, env(safe-area-inset-bottom));

  z-index:999;

  background:var(--bg);

  padding-top:8px;

  display:grid;

  grid-template-columns:repeat(3,1fr);

  gap:6px;
}

.keypad button{

  height:48px;

  border:none;

  border-radius:10px;

  background:#454545;

  color:white;

  font-size:22px;

  font-weight:700;
}

.keypad button:active{

  transform:scale(.96);
}

.enter{
  background:#1976d2 !important;
}

.clear{
  background:#d32f2f !important;
}

</style>
</head>
<body>

<div
class="resultBox"
onclick="copyResult()">

<div
id="result"
class="result">
00:00:00:00
</div>

<div
id="frames"
class="frames">
0 frames
</div>

<div
id="copy"
class="copy">
タップでコピー
</div>

</div>

<div
id="log"
class="log">
</div>

<div class="keypad">

<button onclick="addDigit('1')">1</button>
<button onclick="addDigit('2')">2</button>
<button onclick="addDigit('3')">3</button>

<button onclick="addDigit('4')">4</button>
<button onclick="addDigit('5')">5</button>
<button onclick="addDigit('6')">6</button>

<button onclick="addDigit('7')">7</button>
<button onclick="addDigit('8')">8</button>
<button onclick="addDigit('9')">9</button>

<button onclick="toggleMinus()">±</button>
<button onclick="addDigit('0')">0</button>
<button onclick="backspace()">⌫</button>

<button onclick="appendOperator('*')">×</button>
<button onclick="appendOperator('/')">÷</button>
<button class="enter" onclick="enterLine()">ENT</button>

<button class="clear" onclick="clearAll()">CLR</button>
<button onclick="appendOperator('+')">＋</button>
<button onclick="appendOperator('-')">－</button>

</div>

<script>

const FPS = 30;

let current = "";
let lines = [];

function addDigit(n){

    current += n;
    refresh();
}

function appendOperator(op){

    if(current === "") return;

    const last =
        current.slice(-1);

    if("+-*/".includes(last)){

        current =
            current.slice(0,-1)
            + op;

    }else{

        current += op;
    }

    refresh();
}

function toggleMinus(){

    if(current.startsWith("-")){

        current =
            current.substring(1);

    }else{

        current =
            "-" + current;
    }

    refresh();
}

function backspace(){

    current =
        current.slice(0,-1);

    refresh();
}

function enterLine(){

    if(current === "") return;

    lines.unshift(current);

    current = "";

    refresh();
}

function clearAll(){

    current="";
    lines=[];

    refresh();
}

function refresh(){

    const html=[];

    if(current !== ""){

        html.push(
        `<div class="line current">${current}</div>`
        );
    }

    lines.forEach(line=>{

        html.push(
        `<div class="line">${line}</div>`
        );
    });

    document.getElementById("log").innerHTML =
        html.join("");

    recalc();
}

function parseValue(v){

    if(v.length<=2){

        return Number(v)*FPS;
    }

    if(v.length<=4){

        const mm=
        parseInt(v.slice(0,-2))||0;

        const ss=
        parseInt(v.slice(-2))||0;

        return (
            mm*60+
            ss
        )*FPS;
    }

    if(v.length<=6){

        const hh=
        parseInt(v.slice(0,-4))||0;

        const mm=
        parseInt(v.slice(-4,-2))||0;

        const ss=
        parseInt(v.slice(-2))||0;

        return (
            hh*3600+
            mm*60+
            ss
        )*FPS;
    }

    v=v.padStart(8,"0");

    const hh=parseInt(v.slice(0,2));
    const mm=parseInt(v.slice(2,4));
    const ss=parseInt(v.slice(4,6));
    const ff=parseInt(v.slice(6,8));

    return (
        hh*3600*FPS+
        mm*60*FPS+
        ss*FPS+
        ff
    );
}

function evaluate(exp){

    const tokens =
        exp.match(/\d+|[+\-*/]/g);

    if(!tokens) return 0;

    let total=null;
    let op="+";

    for(const t of tokens){

        if("+-*/".includes(t)){

            op=t;
            continue;
        }

        let value;

        if(
            total!==null &&
            (op==="*" || op==="/")
        ){

            value=Number(t);

        }else{

            value=parseValue(t);
        }

        if(total===null){

            total=value;
            continue;
        }

        switch(op){

            case "+":
                total+=value;
                break;

            case "-":
                total-=value;
                break;

            case "*":
                total*=value;
                break;

            case "/":
                total/=value;
                break;
        }
    }

    return Math.round(total||0);
}

function recalc(){

    let total=0;

    lines.forEach(line=>{

        total+=evaluate(line);

    });

    document.getElementById("result").innerText =
        framesToTC(total);

    document.getElementById("frames").innerText =
        total.toLocaleString()
        + " frames";
}

function framesToTC(frames){

    let sign="";

    if(frames<0){

        sign="-";
        frames=Math.abs(frames);
    }

    const hh=
        Math.floor(
        frames/(3600*FPS));

    frames%=3600*FPS;

    const mm=
        Math.floor(
        frames/(60*FPS));

    frames%=60*FPS;

    const ss=
        Math.floor(
        frames/FPS);

    const ff=
        frames%FPS;

    return (
        sign+
        String(hh).padStart(2,"0")+":"+
        String(mm).padStart(2,"0")+":"+
        String(ss).padStart(2,"0")+":"+
        String(ff).padStart(2,"0")
    );
}

async function copyResult(){

    try{

        await navigator.clipboard.writeText(
            document.getElementById("result").innerText
        );

        const obj =
            document.getElementById("copy");

        obj.innerText =
            "コピーしました";

        setTimeout(()=>{

            obj.innerText =
                "タップでコピー";

        },1500);

    }catch(e){}
}

refresh();

</script>

</body>
</html>
