<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<title>TC Calculator</title>

<style>
:root{
    --bg:#1d1d1d;
    --panel:#2c2c2c;
    --green:#5cff6b;
    --orange:#ff9800;
    --text:#e0e0e0;
    --border:#3b3b3b;
    --safe-bottom: env(safe-area-inset-bottom,0px);
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
    touch-action:manipulation;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;
}

body{
    position:fixed;
    inset:0;
    user-select:none;
}

#app{
    height:100dvh;
    display:flex;
    flex-direction:column;
    overflow:hidden;
}

/* ===== RESULT ===== */

#resultPanel{
    flex:0 0 auto;
    background:#111;
    border-bottom:1px solid var(--border);
    padding:12px;
}

#result{
    text-align:center;
    font-weight:700;
    color:var(--green);
    font-size:clamp(28px,6vw,42px);
    line-height:1.1;
    word-break:break-all;
}

#frames{
    margin-top:6px;
    text-align:center;
    color:#bbb;
    font-size:15px;
}

#copyMsg{
    margin-top:4px;
    text-align:center;
    color:var(--orange);
    font-size:12px;
    height:14px;
}

/* ===== LOG ===== */

#logWrap{
    flex:1;
    overflow:hidden;
    background:var(--panel);
}

#log{
    height:100%;
    overflow-y:auto;
    padding:12px;
    -webkit-overflow-scrolling:touch;
}

.logItem{
    padding:6px 4px;
    font-size:20px;
    color:#d0d0d0;
    border-bottom:1px solid rgba(255,255,255,0.04);
    word-break:break-all;
}

.current{
    color:var(--green);
    font-weight:700;
}

/* ===== KEYPAD ===== */

#keypad{
    flex:0 0 auto;
    background:#222;
    padding:8px;
    padding-bottom:calc(8px + var(--safe-bottom));
    border-top:1px solid var(--border);
}

.grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
}

button{
    height:58px;
    border:none;
    border-radius:10px;
    background:#333;
    color:#fff;
    font-size:24px;
    font-weight:700;
}

button:active{
    transform:scale(0.96);
}

.op{
    background:#4a4a4a;
    color:var(--orange);
}

.ent{
    background:var(--orange);
    color:#000;
}

.clr{
    background:#b00020;
}
</style>
</head>

<body>

<div id="app">

    <div id="resultPanel">
        <div id="result">00:00:00:00</div>
        <div id="frames">0 frames</div>
        <div id="copyMsg"></div>
    </div>

    <div id="logWrap">
        <div id="log"></div>
    </div>

    <div id="keypad">
        <div class="grid">
            <button data-key="1">1</button>
            <button data-key="2">2</button>
            <button data-key="3">3</button>

            <button data-key="4">4</button>
            <button data-key="5">5</button>
            <button data-key="6">6</button>

            <button data-key="7">7</button>
            <button data-key="8">8</button>
            <button data-key="9">9</button>

            <button id="sign">±</button>
            <button data-key="0">0</button>
            <button id="back">⌫</button>

            <button class="op" data-key="*">×</button>
            <button class="op" data-key="/">÷</button>
            <button class="ent" id="ent">ENT</button>

            <button class="clr" id="clr">CLR</button>
            <button class="op" data-key="+">+</button>
            <button class="op" data-key="-">-</button>
        </div>
    </div>

</div>

<script>
document.addEventListener('gesturestart', e=>e.preventDefault());
document.addEventListener('dblclick', e=>e.preventDefault());

const FPS = 30;

const resultEl = document.getElementById('result');
const framesEl = document.getElementById('frames');
const logEl = document.getElementById('log');
const copyMsg = document.getElementById('copyMsg');

let expression = "";
let currentInput = "";
let logs = [];

function digitsToFrames(str){

    str = String(Math.abs(parseInt(str || "0",10)));

    let HH=0,MM=0,SS=0,FF=0;

    if(str.length<=2){
        FF = parseInt(str||0,10);
    }
    else if(str.length<=4){
        FF = parseInt(str.slice(-2),10);
        SS = parseInt(str.slice(0,-2)||0,10);
    }
    else if(str.length<=6){
        FF = parseInt(str.slice(-2),10);
        SS = parseInt(str.slice(-4,-2)||0,10);
        MM = parseInt(str.slice(0,-4)||0,10);
    }
    else{
        FF = parseInt(str.slice(-2),10);
        SS = parseInt(str.slice(-4,-2)||0,10);
        MM = parseInt(str.slice(-6,-4)||0,10);
        HH = parseInt(str.slice(0,-6)||0,10);
    }

    return (((HH*60+MM)*60)+SS)*FPS + FF;
}

function framesToTC(frames){

    let sign = frames < 0 ? "-" : "";
    frames = Math.abs(Math.round(frames));

    const FF = frames % FPS;
    const totalSec = Math.floor(frames/FPS);

    const SS = totalSec % 60;
    const totalMin = Math.floor(totalSec/60);

    const MM = totalMin % 60;
    const HH = Math.floor(totalMin/60);

    const p = v => String(v).padStart(2,'0');

    return `${sign}${p(HH)}:${p(MM)}:${p(SS)}:${p(FF)}`;
}

function updateLog(){

    const scrollTop = logEl.scrollTop;

    logEl.innerHTML = "";

    logs.forEach(item=>{
        const div = document.createElement("div");
        div.className = "logItem";
        div.textContent = item;
        logEl.appendChild(div);
    });

    const current = document.createElement("div");
    current.className = "logItem current";
    current.textContent = currentInput || "";
    logEl.appendChild(current);

    logEl.scrollTop = scrollTop;
}

function updateResult(){

    try{

        const expr = expression + currentInput;

        if(!expr){
            resultEl.textContent = "00:00:00:00";
            framesEl.textContent = "0 frames";
            return;
        }

        let converted = expr.replace(/\d+/g,m=>{
            return digitsToFrames(m);
        });

        let value = Function('"use strict";return ('+converted+')')();

        if(!isFinite(value)) return;

        value = Math.round(value);

        resultEl.textContent = framesToTC(value);
        framesEl.textContent = value + " frames";

    }catch(e){}
}

function inputDigit(d){
    currentInput += d;
    updateLog();
    updateResult();
}

function inputOperator(op){

    if(currentInput===""){
        if(expression==="") return;

        expression = expression.replace(/[+\-*/]+$/,op);
        return;
    }

    logs.push(currentInput);

    expression += currentInput + op;
    currentInput = "";

    updateLog();
    updateResult();
}

function backspace(){
    currentInput = currentInput.slice(0,-1);
    updateLog();
    updateResult();
}

function clearAll(){
    expression="";
    currentInput="";
    logs=[];
    updateLog();
    updateResult();
}

function toggleSign(){

    if(!currentInput) return;

    if(currentInput.startsWith("-")){
        currentInput=currentInput.slice(1);
    }else{
        currentInput="-"+currentInput;
    }

    updateLog();
    updateResult();
}

function enterResult(){

    if(currentInput){
        logs.push(currentInput);
    }

    try{

        const expr=(expression+currentInput);

        if(!expr){
            updateLog();
            return;
        }

        let converted = expr.replace(/\d+/g,m=>{
            return digitsToFrames(m);
        });

        let value = Function('"use strict";return ('+converted+')')();

        if(!isFinite(value)) return;

        value = Math.round(value);

        logs.push("= " + framesToTC(value));

        expression="";
        currentInput=String(value);

        updateLog();
        updateResult();

    }catch(e){}
}

document.querySelectorAll("[data-key]").forEach(btn=>{
    btn.addEventListener("click",()=>{
        const key = btn.dataset.key;

        if(/[0-9]/.test(key)){
            inputDigit(key);
        }else{
            inputOperator(key);
        }
    });
});

document.getElementById("back").addEventListener("click",backspace);
document.getElementById("clr").addEventListener("click",clearAll);
document.getElementById("ent").addEventListener("click",enterResult);
document.getElementById("sign").addEventListener("click",toggleSign);

resultEl.addEventListener("click",async()=>{
    const txt = resultEl.textContent;

    try{
        await navigator.clipboard.writeText(txt);
        copyMsg.textContent="COPIED";
        setTimeout(()=>copyMsg.textContent="",1000);
    }catch(e){}
});

updateLog();
updateResult();
</script>

</body>
</html>
