<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<title>TC Calculator</title>

<style>
:root{
    --bg:#1d1d1d;
    --panel:#2c2c2c;
    --green:#5cff6b;
    --orange:#ff9800;
    --text:#e0e0e0;
    --border:#3b3b3b;
    --safe-bottom:env(safe-area-inset-bottom,0px);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
    touch-action:manipulation;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,Helvetica,sans-serif;
}

body{
    position:fixed;
    inset:0;
    user-select:none;
}

#app{
    height:100dvh;
    display:flex;
    flex-direction:column;
    overflow:hidden;
}

/* RESULT */

#resultPanel{
    flex-shrink:0;
    background:#111;
    border-bottom:1px solid var(--border);
    padding:8px;
}

#result{
    color:var(--green);
    text-align:center;
    font-size:30px;
    font-weight:700;
    line-height:1.1;
}

#frames{
    text-align:center;
    color:#aaa;
    font-size:13px;
    margin-top:2px;
}

#copyMsg{
    height:12px;
    text-align:center;
    font-size:11px;
    color:var(--orange);
    margin-top:2px;
}

/* LOG */

#logWrap{
    flex:1;
    overflow:hidden;
    background:var(--panel);
}

#log{
    height:100%;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    padding:10px;
}

.logItem{
    padding:8px 4px;
    font-size:20px;
    border-bottom:1px solid rgba(255,255,255,.05);
    word-break:break-all;
}

.current{
    color:var(--green);
    font-weight:700;
}

/* KEYPAD */

#keypad{
    flex-shrink:0;
    background:#202020;
    border-top:1px solid var(--border);
    padding:6px;
    padding-bottom:calc(6px + var(--safe-bottom));
}

.grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:6px;
}

button{
    border:none;
    border-radius:10px;
    background:#333;
    color:#fff;
    font-size:18px;
    font-weight:700;
    height:44px;
}

button:active{
    transform:scale(.96);
}

.op{
    background:#444;
    color:var(--orange);
}

.ent{
    background:var(--orange);
    color:#000;
}

.clr{
    background:#991b1b;
}
</style>
</head>

<body>

<div id="app">

    <div id="resultPanel">
        <div id="result">00:00:00:00</div>
        <div id="frames">0 frames</div>
        <div id="copyMsg"></div>
    </div>

    <div id="logWrap">
        <div id="log"></div>
    </div>

    <div id="keypad">
        <div class="grid">

            <button data-num="1">1</button>
            <button data-num="2">2</button>
            <button data-num="3">3</button>

            <button data-num="4">4</button>
            <button data-num="5">5</button>
            <button data-num="6">6</button>

            <button data-num="7">7</button>
            <button data-num="8">8</button>
            <button data-num="9">9</button>

            <button id="sign">±</button>
            <button data-num="0">0</button>
            <button id="back">⌫</button>

            <button class="op" data-op="*">×</button>
            <button class="op" data-op="/">÷</button>
            <button class="ent" id="ent">ENT</button>

            <button class="clr" id="clr">CLR</button>
            <button class="op" data-op="+">+</button>
            <button class="op" data-op="-">-</button>

        </div>
    </div>

</div>

<script>
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('dblclick',e=>e.preventDefault());

const FPS=30;

const resultEl=document.getElementById('result');
const framesEl=document.getElementById('frames');
const copyMsg=document.getElementById('copyMsg');
const logEl=document.getElementById('log');

let expression="";
let currentInput="";
let logs=[];

function digitsToFrames(num){

    num=String(Math.abs(parseInt(num||"0",10)));

    let hh=0;
    let mm=0;
    let ss=0;
    let ff=0;

    if(num.length<=2){

        ff=parseInt(num||0,10);

    }else if(num.length<=4){

        ff=parseInt(num.slice(-2),10);
        ss=parseInt(num.slice(0,-2)||0,10);

    }else if(num.length<=6){

        ff=parseInt(num.slice(-2),10);
        ss=parseInt(num.slice(-4,-2)||0,10);
        mm=parseInt(num.slice(0,-4)||0,10);

    }else{

        ff=parseInt(num.slice(-2),10);
        ss=parseInt(num.slice(-4,-2)||0,10);
        mm=parseInt(num.slice(-6,-4)||0,10);
        hh=parseInt(num.slice(0,-6)||0,10);
    }

    return (((hh*60+mm)*60)+ss)*FPS+ff;
}

function framesToTC(frames){

    let sign="";

    if(frames<0){
        sign="-";
        frames=Math.abs(frames);
    }

    frames=Math.round(frames);

    let ff=frames%FPS;
    let totalSec=Math.floor(frames/FPS);

    let ss=totalSec%60;
    let totalMin=Math.floor(totalSec/60);

    let mm=totalMin%60;
    let hh=Math.floor(totalMin/60);

    const p=v=>String(v).padStart(2,"0");

    return sign+
        p(hh)+":"+
        p(mm)+":"+
        p(ss)+":"+
        p(ff);
}

function evaluateExpression(){

    const expr=expression+currentInput;

    if(!expr){
        return 0;
    }

    const converted=expr.replace(/\d+/g,m=>digitsToFrames(m));

    return Math.round(
        Function('"use strict";return ('+converted+')')()
    );
}

function updateResult(){

    try{

        const frames=evaluateExpression();

        resultEl.textContent=framesToTC(frames);
        framesEl.textContent=frames+" frames";

    }catch(e){}
}

function updateLog(){

    const pos=logEl.scrollTop;

    logEl.innerHTML="";

    logs.forEach(v=>{

        const div=document.createElement("div");
        div.className="logItem";
        div.textContent=v;
        logEl.appendChild(div);

    });

    const cur=document.createElement("div");
    cur.className="logItem current";
    cur.textContent=currentInput;
    logEl.appendChild(cur);

    logEl.scrollTop=pos;
}

function appendNumber(n){

    currentInput+=n;

    updateLog();
    updateResult();
}

function appendOperator(op){

    if(currentInput===""){

        if(expression==="") return;

        expression=expression.replace(/[+\-*/]+$/,op);
        return;
    }

    logs.push(currentInput);

    expression+=currentInput+op;

    currentInput="";

    updateLog();
    updateResult();
}

function backspace(){

    currentInput=currentInput.slice(0,-1);

    updateLog();
    updateResult();
}

function clearAll(){

    expression="";
    currentInput="";
    logs=[];

    updateLog();
    updateResult();
}

function toggleSign(){

    if(!currentInput) return;

    if(currentInput.startsWith("-")){
        currentInput=currentInput.substring(1);
    }else{
        currentInput="-"+currentInput;
    }

    updateLog();
    updateResult();
}

function enter(){

    try{

        const frames=evaluateExpression();

        logs.push(framesToTC(frames));

        expression="";
        currentInput=String(frames);

        updateLog();
        updateResult();

    }catch(e){}
}

document.querySelectorAll("[data-num]").forEach(btn=>{

    btn.addEventListener("click",()=>{

        appendNumber(btn.dataset.num);

    });

});

document.querySelectorAll("[data-op]").forEach(btn=>{

    btn.addEventListener("click",()=>{

        appendOperator(btn.dataset.op);

    });

});

document.getElementById("back").addEventListener("click",backspace);
document.getElementById("clr").addEventListener("click",clearAll);
document.getElementById("sign").addEventListener("click",toggleSign);
document.getElementById("ent").addEventListener("click",enter);

resultEl.addEventListener("click",async()=>{

    try{

        await navigator.clipboard.writeText(resultEl.textContent);

        copyMsg.textContent="COPIED";

        setTimeout(()=>{
            copyMsg.textContent="";
        },1000);

    }catch(e){}
});

updateLog();
updateResult();
</script>

</body>
</html>
